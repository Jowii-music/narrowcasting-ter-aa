<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Slide</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
      <nav class="navbar">
    <div class="logo"> <a href="admin.html">Admin Panel</a></div>
    <ul class="nav-links">
      <li><a href="contentLibrary.html">Content Library</a></li>
      <li><a href="upload.html">Create Slide</a></li>
    </ul>
  </nav>

  <div class="upload-page">
    <h1>Upload Slide</h1>

    <form id="uploadForm" class="upload-form">
      <label>
        Name
        <input type="text" name="name" required>
      </label>

      <label>
        Duration (seconds)
        <input type="number" name="duration" required>
      </label>

      <label>
        Display
        <input type="text" name="display" required>
      </label>

      <label>
        Select Image (max 50MB)
        <input type="file" name="image" accept="image/*, video/*" required>
      </label>

      <button type="submit">Upload</button>
    </form>

    <div id="result"></div>
  </div>

  <!-- your same script from before -->
</body>
  <script src="upload.js"></script>
</html>
