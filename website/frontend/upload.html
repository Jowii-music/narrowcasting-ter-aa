<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Slide</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
      <nav class="navbar">
    <div class="logo"> <a href="admin.html">Admin Panel</a></div>
    <ul class="nav-links">
      <li><a href="#">Slides</a></li>
      <li><a href="contentLibrary.html">Content Library</a></li>
      <li><a href="upload.html">Create Slide</a></li>
    </ul>
  </nav>

  <div class="upload-page">
    <h1>Upload Slide</h1>

    <form id="uploadForm" class="upload-form">
      <label>
        Name
        <input type="text" name="name" required>
      </label>

      <label>
        Duration (seconds)
        <input type="number" name="duration" required>
      </label>

      <label>
        Display
        <input type="text" name="display" required>
      </label>

      <label>
        Filename
        <input type="text" name="fileName" required>
      </label>

      <label>
        Type
        <input type="text" name="type" required>
      </label>

      <label>
        Select Image (max 50MB)
        <input type="file" name="image" accept="image/*" required>
      </label>

      <button type="submit">Upload</button>
    </form>

    <div id="result"></div>
  </div>

  <!-- your same script from before -->
</body>
  <script>
    const form = document.getElementById('uploadForm');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);

      try {
        const response = await fetch('http://localhost:3000/upload', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.innerHTML = `<p style="color:green;">Upload successful! ID: ${data.file.id}</p>`;
        } else {
          resultDiv.innerHTML = `<p style="color:red;">Error: ${data.message||'unauthorized'}</p>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<p style="color:red;">Server error: ${err.message}</p>`;
      }
    });

    async function checkAuth() {
      try {
        const res = await fetch('http://localhost:3000/auth/check', {
          credentials: 'include'
        });

        if (!res.ok) {
          window.location.href = 'index.html';
        }
      } catch {
        console.log('logged in: do nothing');
      }
    }

  checkAuth();
  </script>
</html>
