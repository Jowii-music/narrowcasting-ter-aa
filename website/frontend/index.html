<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="style/style.css">
    <title>Login</title>
</head>
<body>
    <div class="centered-page">
        <div class="form">
            <form action="index.html" class="login_form" id="LoginForm">

            </form>
        </div>
    </div>

<script src="js/login.js"></script>
